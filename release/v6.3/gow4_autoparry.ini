; 自动弹反 / 自动闪避配置，DLL 每秒重读，改完不用重启
[autoparry]
; 自动弹反 1 开 / 0 关（只处理游戏判定的可弹反区域：正前方左右各 90 度；你自己按着 L1 时不干预）
parry=1
; 自动闪避 1 开 / 0 关：背后半圈的刀、巨魔的刀 → 吞掉这一刀并替你按 × + 推摇杆往背离敌人方向闪
evade=1
; 闪避时 × 按住多少毫秒（手按实测 150~200）
evade_ms=200
; 预判闪避 1 开 / 0 关：读敌人当前招式的时间轴（Attacking 标签结束 ≈ 出伤），出伤前提前闪，不等刀碰到
predict=1
; 离出伤还剩多少毫秒时按 ×（越大闪得越早）
predict_ms=350
; 敌人在多少米以内才预判
predict_dist=6
; 巨魔这类预判闪避往侧面闪 1 / 往后闪 0（它下砸能打到 4~5 m，往后闪躲不开）
evade_side=1
; 巨魔这类预判闪避用翻滚（连按两下 ×，挪得更远）1 / 单下闪避 0
evade_roll=1
; 预判闪避后还被碰到：1 吞掉（不掉血不受击）/ 0 不吞、交给游戏自己判（看游戏的闪避本身躲不躲得掉，可能挨打）
pred_swallow=1
; 调试用：招式系统逐帧快照写到 %TEMP%\gow4_ms_snap.bin，默认关
snap=0
; 调试用：弹反窗口里不限命中区域。开了背后的刀会变成转身格挡，默认关
zone=0
; 调试用：写 1 就替你原地往身后闪一次并记录位移，DLL 做完会改回 0
test_evade=0
