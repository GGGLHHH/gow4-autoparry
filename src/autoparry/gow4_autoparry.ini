; 自动弹反 / 自动闪避配置，DLL 每秒重读，改完不用重启
[autoparry]
; 自动弹反 1 开 / 0 关（只处理游戏判定的可弹反区域：正前方左右各 90 度；你自己按着 L1 时不干预）
parry=1
; 自动闪避 1 开 / 0 关：背后半圈的刀、巨魔的刀 → 吞掉这一刀并替你按 × + 推摇杆往背离敌人方向闪
evade=1
; 闪避时 × 按住多少毫秒（手按实测 150~200）
evade_ms=200
; 预判闪避 1 开 / 0 关：读敌人当前招式的时间轴（Attacking 标签结束 ≈ 出伤），出伤前提前闪，不等刀碰到
predict=1
; 离出伤还剩多少毫秒时按 ×（越大闪得越早）
predict_ms=350
; 敌人在多少米以内才预判
predict_dist=6
; 巨魔这类预判闪避往侧面闪 1 / 往后闪 0（它下砸能打到 4~5 m，往后闪躲不开）
evade_side=1
; 按敌人招式数据预读这一招的攻击段，红光 / 盾接不住的提前闪 1 开 / 0 关（关了就回到「碰到才闪」）
preread=1
; 实验：巨魔这类预判闪避用翻滚（连按两下 ×，挪得更远）1 / 单下闪避 0。v6.6 实测 5 次只翻出 1 次，默认关
evade_roll=0
; 翻滚节奏（毫秒）：第一下按多久、中间松多久、第二下按多久（闪避招式数据：0.338 s 之后才接受下一个 ×，所以第二下要在第一下后 ≥0.4 s 才按下）
roll_tap1=120
roll_gap=280
roll_tap2=150
; 巨魔类用翻滚时，离出伤还剩多少毫秒开始按（翻滚要等第二下才接上，所以比 predict_ms 大）
predict_roll_ms=750
; 预判闪避后还被碰到：1 吞掉（不掉血不受击）/ 0 不吞、交给游戏自己判（看游戏的闪避本身躲不躲得掉，可能挨打）
pred_swallow=1
; 飞行物预判弹反 1 开 / 0 关：按飞行物轨迹算还有多久打到你，提前按 L1，让游戏自己判弹反（会把飞行物打回去）
proj_pre=1
; 飞行物离打到你还剩多少毫秒时按 L1（近战实测按下后约 140 ms 弹反窗口已开）
proj_lead_ms=160
; 盾接不了的 / 从背后来的飞行物，到点提前侧闪 1 开 / 0 关（关了就回到「碰到才吞掉再闪」）
proj_evade=1
; 这类飞行物离打到你还剩多少毫秒时按 ×（往离开弹道的方向闪）
proj_evade_ms=300
; 飞行物轨迹诊断 1 开 / 0 关：开了会在日志里逐条记「· 扫掠」行（很多），只在调预判时开
proj_diag=0
; 连按 / 定时单按 QTE 自动完成 1 开 / 0 关：开宝箱、抬东西、挣脱这类「连按某键」的进度条自己涨满
;（用的是游戏自带的自动成功路径；个别游戏自己标了不许自动的仍要手按，日志 gow4_qte.log 里会写明）
qte_mash=1
; QTE 记录器 1 开 / 0 关：只记录奎托斯的按键判定（不改任何结果），写 %TEMP%\gow4_qte.log
qte_log=1
; 调试用：招式系统逐帧快照写到 %TEMP%\gow4_ms_snap.bin，默认关
snap=0
; 调试用：弹反窗口里不限命中区域。开了背后的刀会变成转身格挡，默认关
zone=0
; 调试用：写 1 就替你原地往身后闪一次并记录位移，DLL 做完会改回 0
test_evade=0
; 自测时用翻滚 1 / 单下 0
test_roll=0
; 调试用：写 1 后回到游戏，游戏连续运行 3 s 就自动做 7 次闪避/翻滚（一前一后），做完改回 0
test_seq=0
