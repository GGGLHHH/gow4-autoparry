; 透视配置。用修改器的菜单改最方便（改完马上生效）；手改保存也行，2 秒内生效
[esp]
; 总开关：修改器的 F12 切的就是它（弹反那边的一起切）。0 = 什么都不标
master=1
; 透视自己的开关
enabled=1
; 只显示多少米以内的
radius=60
; 视角按水平(h)还是垂直(v)算；标签和物品对不上时换另一个
fov=h
; 标签大小倍数
scale=1
; 逐类开关，0 = 这一类不标
; 宝箱
show_chest=1
; 稀有宝箱
show_rare=1
; 传说宝箱
show_legend=1
; 诺恩宝箱，以及它的三种机关：符文封印、符文铃铛、符文转盘
show_nornir=1
show_seal=1
show_bell=1
show_spinner=1
; 银币
show_silver=1
; 古物
show_artifact=1
; 奥丁的乌鸦
show_raven=1
; 碑文
show_lore=1
; 巨人神龛
show_shrine=1
; 藏宝图
show_map=1
; 符文
show_rune=1
; 战利品
show_bag=1
